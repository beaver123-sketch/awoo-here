.home-heart{font-size:19px;color:#b58d81;font-weight:500;display:inline-block;transform:rotate(16deg)}
.home-cover-title p{font-size:11px;color:#819088;letter-spacing:.2px;margin-top:5px}
.home-room{height:390px;position:relative;border-radius:19px 19px 9px 9px;margin:0;overflow:hidden;isolation:isolate;background-color:#e6dfcd;background-image:linear-gradient(180deg,transparent 74%,rgba(47,51,38,.13) 100%),none;background-position:center;background-size:cover;box-shadow:0 6px 24px #3b4a3420}
.home-room:before{display:none}
.home-room::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(250,244,231,.07),transparent 35%,rgba(247,237,226,.04))}
.room-light{position:absolute;left:-15%;top:-19%;width:85%;height:90%;pointer-events:none;background:linear-gradient(125deg,rgba(255,248,218,.38),transparent 55%);mix-blend-mode:screen;z-index:1}
.room-cat-actor{position:absolute;left:46%;bottom:31px;width:126px;height:139px;z-index:3;transform:translateX(-50%) scaleX(var(--face,1));transform-origin:50% 100%;will-change:left}
.room-cat-pixel{width:126px;height:129px;position:absolute;left:0;bottom:4px;object-fit:contain;object-position:center bottom;image-rendering:pixelated;filter:drop-shadow(0 4px 2px rgba(69,63,48,.18));transform-origin:center bottom;user-select:none;-webkit-user-drag:none;pointer-events:none}
.room-cat-pixel.is-walking{animation:cat-steps .40s steps(2,end) infinite}
.room-cat-pixel.is-stretching{animation:cat-stretch 2.7s cubic-bezier(.4,0,.2,1) both}
.room-cat-pixel.is-breathing{animation:cat-breathe 3.6s ease-in-out infinite}
.room-cat-shadow{position:absolute;z-index:-1;left:13%;bottom:5px;width:75%;height:14px;border-radius:50%;background:rgba(81,69,53,.2);filter:blur(5px);transform:scale(.86)}
.room-motion{position:absolute;left:17px;bottom:15px;z-index:6;background:rgba(254,251,241,.82);border:1px solid rgba(255,255,255,.72);backdrop-filter:blur(4px);border-radius:20px;padding:6px 10px;color:#657368;font-size:10px;font-weight:650;letter-spacing:.2px;pointer-events:none;box-shadow:0 3px 8px rgba(24,43,26,.07)}
.room-corner-note{position:absolute;top:18px;right:14px;z-index:2;background:rgba(252,250,242,.77);padding:7px 10px;border-radius:14px 4px 14px 14px;transform:rotate(3deg);font-size:10px;letter-spacing:.5px;color:#776c5f;pointer-events:none}
.room-corner-note span{color:#be9d79}
.room-footnote{width:100%;min-height:61px;display:flex;align-items:center;gap:10px;background:#fffdf7;border:1px solid #eceae2;border-top:none;border-radius:0 0 14px 14px;text-align:left;padding:12px 13px}
.room-footnote>span:nth-child(2){flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.room-footnote strong{font-size:12px;font-weight:780;color:#354638}
.room-footnote small{font-size:10px;color:#819185;line-height:1.5}
.room-footnote>.icon{color:#91a194;width:16px}
.little-paw-dot{width:33px;height:33px;border-radius:50%;background:#e7ede5;color:#788b79;display:grid;place-items:center;font-size:20px}
.home-after{padding:19px 16px 28px}
.home-shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.home-shortcut{min-height:89px;display:flex;align-items:flex-start;position:relative;flex-direction:column;gap:5px;border-radius:14px;text-align:left;padding:14px 12px 13px;overflow:hidden}
.shortcut-journal{background:#e9eee7}.shortcut-health{background:#eeece6}
.shortcut-symbol{font-size:20px;color:#788e7f;line-height:1}.home-shortcut strong{font-size:13px;font-weight:800}
.home-shortcut small{font-size:10px;color:#8a958c;line-height:1.45;padding-right:8px}
.home-shortcut>.icon{position:absolute;right:12px;top:18px;width:14px;height:14px;opacity:.4}
.home-memory{background:white;border-radius:16px;width:100%;display:flex;align-items:center;gap:12px;margin-top:8px;overflow:hidden;padding:8px;text-align:left;box-shadow:0 4px 16px rgba(46,68,51,.04)}
.home-memory-cover{width:77px;height:73px;border-radius:11px;overflow:hidden;flex-shrink:0;background:#ebeee9;display:grid;place-items:center}
.home-memory-cover img{width:100%;height:100%;object-fit:cover}
.home-memory-copy{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.home-memory-copy span{font-size:9px;color:#99a69c}
.home-memory-copy strong{font-size:12px;color:#334739;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-weight:760}
.home-memory-copy small{font-size:10px;color:#98a199}
.home-memory>.icon{width:13px;height:13px;color:#a0a99f;margin-right:6px}
.home-after .section-head{margin-top:23px}
@keyframes cat-breathe{0%,100%{transform:scaleY(1) translateY(0)}50%{transform:scaleY(1.012) translateY(1px)}}
@keyframes cat-steps{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-2px) rotate(.5deg)}}
@keyframes cat-stretch{0%{transform:scaleX(.9) scaleY(1.04) translateY(0)}18%{transform:scaleX(.96) scaleY(.94) translateY(3px)}50%{transform:scaleX(1.16) scaleY(.84) translateY(6px)}77%{transform:scaleX(1.12) scaleY(.85) translateY(5px)}100%{transform:scaleX(1) scaleY(1) translateY(0)}}
@media(max-width:350px){.home-room{height:345px}.room-cat-actor{width:110px;height:130px;bottom:23px}.room-cat-pixel{width:110px;height:120px}.room-corner-note{font-size:9px}}
@media(prefers-reduced-motion: reduce){.room-cat-pixel{animation:none!important}.room-cat-actor{transition:none!important}}

/* v0.2 final polish */
.home-shortcut>span:nth-child(2){display:flex;flex-direction:column;gap:5px;width:100%}.home-shortcut strong{display:block}.home-shortcut small{display:block;font-size:10px;line-height:1.4;padding-right:10px}.room-footnote .room-motion{position:static;display:block;background:none;border:0;backdrop-filter:none;box-shadow:none;border-radius:0;padding:0;color:#899688;font-size:10px;font-weight:500;letter-spacing:0;pointer-events:none}


/* v0.3 · Awoo Here little illustrated dock */
.tabbar{
  position:relative; flex:0 0 auto; z-index:15;
  background:rgba(251,252,249,.96);
  border-top:1px solid #e7e9e3;
  padding:8px 10px max(8px,env(safe-area-inset-bottom));
  min-height:calc(77px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  align-items:start;justify-content:stretch;gap:0;
  box-shadow:0 -9px 25px rgba(42,57,45,.035);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
}
.tabbar::before{content:'';position:absolute;top:0;left:18px;right:18px;height:1px;background:linear-gradient(90deg,transparent,#d7dcd4 25%,#d7dcd4 75%,transparent);pointer-events:none}
.tab{width:100%;min-width:0;padding:2px 0 0;gap:3px;position:relative;color:#909b91;display:flex;align-items:center;flex-direction:column;justify-content:flex-start;font-size:10px;font-weight:700;line-height:1.3;-webkit-tap-highlight-color:transparent}
.tab-figure{width:46px;height:42px;display:grid;place-items:center;border-radius:16px;position:relative;transition:background .2s ease,transform .2s ease}
.tab-figure .nav-art{width:32px;height:32px;display:block;transition:transform .2s ease;overflow:visible}
.tab.is-active{color:#2F4537}
.tab.is-active .tab-figure{background:#E6EEE5;transform:translateY(-2px) rotate(-2deg)}
.tab.is-active .tab-figure::after{content:'';position:absolute;right:3px;top:1px;width:5px;height:5px;background:#D79D8D;border-radius:50%;box-shadow:0 0 0 2px #fbfcf9}
.tab.is-active .tab-label{font-weight:850}
.tab:active .nav-art{transform:scale(.88) rotate(5deg)}
.tab-center-wrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:0;color:#617666;position:relative;font-size:10px;font-weight:800}
.tab-center{width:60px;height:54px;display:grid;place-items:center;border:none;background:transparent;border-radius:0;box-shadow:none;transform:translateY(-11px);padding:0;filter:drop-shadow(0 6px 6px rgba(47,78,55,.16));transition:transform .18s ease}
.tab-center:hover{transform:translateY(-12px) rotate(5deg)}
.tab-center:active{transform:translateY(-7px) scale(.92)}
.tab-center .nav-add{width:57px;height:57px;display:block;overflow:visible}
.tab-center-label{display:block;margin-top:-11px;font-size:10px;font-weight:850;color:#526D5E}
@media(max-width:350px){.tabbar{padding-left:4px;padding-right:4px}.tab-figure{width:40px}.tab-figure .nav-art{width:30px;height:30px}.tab-center .nav-add{width:53px;height:53px}}
@media(prefers-reduced-motion:reduce){.tab-figure,.tab-figure .nav-art,.tab-center{transition:none}}

.stage-room:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#fffdfa20 0%,transparent 43%,transparent 75%,#dacdb924 100%);pointer-events:none;z-index:1}
.room-sunbeams{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,#fff7dc16 0%,#fff6c00b 23%,transparent 60%);z-index:2}
.stage-room .room-cat-actor{position:absolute;z-index:3;bottom:31px;width:176px;height:167px;left:46%;transform:translateX(-50%) scaleX(var(--face,1));transform-origin:50% 100%;filter:drop-shadow(0 2px 1px #ffffff9a)}
.stage-room .room-cat-pixel{width:176px;height:157px;bottom:0;left:0;object-fit:contain;object-position:center bottom;image-rendering:pixelated;filter:drop-shadow(0 4px 2px #60524765)}
.stage-room .room-cat-shadow{bottom:1px;background:#61574444;height:13px;left:12%;width:76%}
.stage-caption{position:relative;z-index:4;margin:-15px 14px 0;min-height:76px;border-radius:18px;display:flex;align-items:center;gap:11px;padding:10px 12px;background:rgba(255,254,249,.94);box-shadow:0 7px 24px #615b4a1c;border:1px solid #ffffffed;backdrop-filter:blur(12px)}
.caption-avatar{width:46px;height:46px;flex-shrink:0;padding:3px;background:#e8e3d6;border-radius:50%;box-shadow:inset 0 0 0 1px #ffffff}.caption-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}.stage-caption>span:nth-child(2){flex:1;display:flex;flex-direction:column;gap:6px}.stage-caption strong{font-size:13px;font-weight:800;color:#394a3b}.stage-caption small{color:#879084;font-size:11px}.caption-heart{color:#cb968e;font-size:14px}.stage-caption>button{padding:8px 4px;color:#778b7d}
.home-body{padding:17px 16px 6px}.shortcut-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.feature-card{display:flex;align-items:center;gap:9px;background:#fffefa;border:1px solid #f0ede7;border-radius:16px;text-align:left;padding:11px 9px;min-height:83px;box-shadow:0 6px 15px #5b60430b;min-width:0}.feature-card:active{transform:scale(.98)}.feature-badge{width:43px;height:43px;display:grid;place-items:center;flex-shrink:0;border-radius:14px;transform:rotate(-5deg)}.feature-badge svg{width:24px;height:24px;stroke-width:1.9}.feature-badge.peach{background:#f5e7d7;color:#ad8661}.feature-badge.pink{background:#f8e5e3;color:#ce7e81}.feature-badge.sage{background:#e4eddf;color:#64866c}.feature-badge.blue{background:#e4ebf0;color:#6a8eaa}.feature-card span:last-child{display:flex;flex-direction:column;gap:4px;min-width:0}.feature-card strong{font-size:12px;font-weight:850;white-space:nowrap;color:#303d33}.feature-card small{font-size:9px;color:#979a91;white-space:nowrap}
.v4-section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 1px 12px}.v4-section-title strong{font-size:16px;font-weight:820;letter-spacing:-.3px}.v4-section-title button{color:#869287;font-size:11px;display:flex;align-items:center;gap:2px}
.memory-strip{width:100%;display:flex;align-items:center;gap:12px;border-radius:16px;background:#fff;box-shadow:0 3px 16px #5560500b;padding:9px;text-align:left}.memory-strip>img{width:91px;height:85px;border-radius:12px;object-fit:cover;background:#e8e1d6;flex-shrink:0}.memory-strip>span{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}.memory-strip small{font-size:10px;color:#9b9e93}.memory-strip strong{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.memory-strip em{font-style:normal;font-size:10px;color:#809486;display:flex;align-items:center}.memory-strip em svg{width:12px;height:12px}.memory-empty{width:100%;text-align:center;background:#fff;border-radius:15px;padding:25px 10px;color:#8b9a8d}.home-signoff{font-size:9px;text-align:center;margin:28px 0 5px;color:#a8b3a6;letter-spacing:1.3px}
/* Navigation: five original SVG illustrated pictograms; no emoji glyphs */
.tabbar{min-height:calc(75px + env(safe-area-inset-bottom));padding:6px 8px max(8px,env(safe-area-inset-bottom));border-top:1px solid #eeeae3;background:#fffefaF5;box-shadow:0 -8px 25px #423e3009;backdrop-filter:blur(20px)}.tabbar:before{display:none}.tab-figure{height:41px;width:48px;border-radius:15px}.tab-figure .nav-art{height:34px;width:34px;filter:drop-shadow(0 1px 0 #fff)}.tab.is-active .tab-figure{background:#eaf0e7;transform:translateY(-2px)}.tab.is-active .tab-figure:after{background:#dfa89c}.tab-label{letter-spacing:-.3px}.tab-center-wrap{gap:0}.tab-center .nav-add{height:60px;width:60px}.tab-center-label{font-size:9px;letter-spacing:-.2px}
/* Common headers */
.v4-pagehead{padding:26px 23px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px}.v4-pagehead h1{font-size:24px;line-height:1.3;letter-spacing:-.8px;font-weight:870;color:#25372d}.v4-pagehead p{font-size:11px;color:#93988e;margin-top:7px;line-height:1.5}.hand-heart{color:#c99a8f;font-weight:400;font-size:19px;vertical-align:middle;padding-left:4px}.head-control{width:36px;height:36px;background:#fff;border:1px solid #f0eee8;border-radius:50%;display:grid;place-items:center;color:#526e5a}

    case 'health':return frame(`<path d="M12 6.5H29c1 0 1.8.8 1.8 1.8V32c0 1.1-.8 2-1.8 2H12c-2.4 0-4-1.6-4-4V10.5c0-2.5 1.6-4 4-4Z" fill="#E2EBDD" ${stroke}/><path d="M13 6.6V34" ${stroke}/><path d="M22 16.3c-1.9-2.3-6.2-1.3-6.2 2.2 0 3 6.2 7.5 6.2 7.5s6.2-4.5 6.2-7.5c0-3.5-4.3-4.5-6.2-2.2Z" fill="#F3C5BB" ${stroke}/><path d="M22 18v5.2M19.4 20.6h5.2" stroke="#FFFDF9" stroke-width="1.8" stroke-linecap="round"/>`);
    case 'ai':return frame(`<path d="M8 19.7 10.4 9l8 5.2 8-5.2L29 19.7v5.5c0 5.3-4.4 9.4-10.5 9.4S8 30.5 8 25.2Z" fill="#E8E2D5" ${stroke}/><path d="m13 22.8 1.4 1.4-1.4 1.4M24 22.8l-1.4 1.4 1.4 1.4M17.4 28q1.5 1.4 3.1 0" ${stroke}/><path d="m31.7 4.5 1.2 4.1 4.1 1.1-4.1 1.2-1.2 4.1-1.2-4.1-4.1-1.2 4.1-1.1Z" fill="#E4B69A" ${stroke}/>`);
  }
  return frame(`<circle cx="20" cy="20" r="12" ${stroke}/>`);
}
function tabbar(){

}

const types={weight:['体重记录','weight'],vaccine:['疫苗记录','medical'],deworm:['驱虫记录','spark'],visit:['就诊记录','medical'],note:['状态观察','book']};
function health(){
 const c=cat(),recs=state.health.filter(x=>x.catId===c.id).sort((a,b)=>new Date(b.date)-new Date(a.date)),weights=recs.filter(x=>x.type==='weight').sort((a,b)=>a.date.localeCompare(b.date)),w=weights.at(-1),pending=recs.filter(x=>x.nextDate&&x.nextDate>=todayISO()).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));
 const points=weights.slice(-7);const age=c.birthday?ageLabel(c.birthday):'未填写';
 return `<div class="v4-health"><header class="v4-pagehead health-head"><div><h1>健康小本本</h1><p>好好照顾它，也好好陪伴它。</p></div><button class="head-control" data-action="add-health" aria-label="新增健康记录">${icon('plus')}</button></header>
 <button class="health-pet-card" data-action="cats"><img src="${esc(c.photo||D.cat)}" alt=""/><span><strong>${esc(c.name)}</strong><small>${esc(c.breed||'猫咪档案')} · ${age}</small></span><em>切换 ${icon('down','sm')}</em></button>
 <div class="health-tabs">${[['overview','健康概览'],['history','健康记录'],['profile','猫咪资料']].map(([id,label])=>`<button data-healthtab="${id}" class="${ui.healthTab===id?'active':''}">${label}</button>`).join('')}</div>
 ${ui.healthTab==='profile'?profileView(c):ui.healthTab==='history'?historyView(recs):`<div class="health-overview">
  <div class="health-status"><div><small>今天的状态</small><strong>陪它好好生活 <span>♡</span></strong><p>没有设置每日打卡任务，<br>重要的事随时记就好。</p></div><img src="${sprite('loaf')}" alt="像素小猫趴着休息"/></div>
  <div class="health-metrics"><button data-action="record-type" data-type="weight"><small>最近体重</small><strong>${w?esc(w.value)+' <i>kg</i>':'—'}</strong><span>${w?esc(prettyDate(w.date)):'点此记录体重'} ${icon('right','sm')}</span></button><button data-healthtab="profile"><small>小猫年龄</small><strong>${age}</strong><span>完善猫咪档案 ${icon('right','sm')}</span></button></div>
  <section class="trend-panel"><div class="v4-section-title"><strong>体重趋势</strong><button data-action="record-type" data-type="weight">记体重 ${icon('plus','sm')}</button></div><div class="chart-filters"><span class="active">最近记录</span><span>${points.length} 条体重数据</span></div>${healthChart(points)}</section>
  <section class="reminder-panel"><div class="v4-section-title"><strong>待办提醒</strong><button data-action="add-health">查看 / 添加 ${icon('right','sm')}</button></div>${pending.length?pending.slice(0,3).map(x=>`<div class="reminder-item"><span class="reminder-icon">${icon('calendar')}</span><span><strong>${esc(x.title||types[x.type]?.[0]||'照护提醒')}</strong><small>${esc(x.nextDate)}</small></span><em>待完成</em></div>`).join(''):`<button class="reminder-empty" data-action="record-type" data-type="deworm"><span class="reminder-icon">${icon('calendar')}</span><span><strong>没有待办提醒</strong><small>驱虫、疫苗或复诊计划可以在这里记录</small></span>${icon('plus','sm')}</button>`}</section>
  <div class="health-tips">记录仅供日常整理，身体不适请咨询兽医。</div></div>`}
 </div>`;
}
function ageLabel(date){let x=new Date(date),now=new Date();if(!Number.isFinite(+x)||x>now)return '待确认';let months=(now.getFullYear()-x.getFullYear())*12+(now.getMonth()-x.getMonth())-(now.getDate()<x.getDate()?1:0);if(months<12)return `${Math.max(0,months)} 个月`;return `${Math.floor(months/12)} 岁${months%12?` ${months%12}个月`:''}`;}
function healthChart(weights){
 if(!weights.length)return `<div class="chart-empty"><svg viewBox="0 0 320 110" preserveAspectRatio="none" aria-hidden="true"><path d="M0 92H320M0 49H320M0 6H320" stroke="#e6eae0" stroke-dasharray="4 5"/><path d="M8 84Q64 78 102 57T218 49T313 20" stroke="#8ca391" stroke-width="3" stroke-dasharray="6 8" fill="none" opacity=".35"/></svg><span>记录体重后，这里会出现真实的变化曲线</span></div>`;
 const vals=weights.map(w=>Number(w.value));let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=.2;max+=.2}const pts=vals.map((v,i)=>{let x=16+i*(286/Math.max(1,vals.length-1)),y=120-((v-min)/(max-min))*93;return [x,y]});const poly=pts.map(p=>p.join(',')).join(' ');return `<div class="chart-real"><svg viewBox="0 0 320 150" role="img" aria-label="根据已记录数据生成的体重折线图"><path d="M0 30H320M0 74H320M0 120H320" stroke="#e6eae0" stroke-dasharray="4 5"/><polyline points="${poly}" fill="none" stroke="#64826e" stroke-linejoin="round" stroke-width="3"/>${pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4.5" fill="#fff" stroke="#64826e" stroke-width="2.5"/>`).join('')}</svg><div class="chart-axis"><span>${weights[0].date.slice(5)}</span><strong>${weights.at(-1).value} kg</strong><span>${weights.at(-1).date.slice(5)}</span></div></div>`;
}

async function compress(file,max=1000,q=.75){if(!file.type.startsWith('image/'))throw Error('请选择图片文件');if(file.size>14*1024*1024)throw Error('单张图片不能超过 14MB');const data=await new Promise((resolve,reject)=>{let rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=()=>reject(Error('照片读取失败'));rd.readAsDataURL(file)});const im=await new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=()=>rej(Error('无法加载这张照片'));img.src=data});const ratio=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));let canv=document.createElement('canvas');canv.width=Math.round(im.naturalWidth*ratio);canv.height=Math.round(im.naturalHeight*ratio);const ctx=canv.getContext('2d');ctx.drawImage(im,0,0,canv.width,canv.height);return canv.toDataURL('image/jpeg',q)}

// Autonomous pixel-cat room: no fake tap interactions or "care" obligations.
const roomBehavior={timer:null,frame:null,token:0,x:.46,index:0,walkFrameTimer:null};
const roomSequence=[
 {pose:'sit',duration:1300,caption:'晒晒太阳'},
 {pose:'walk',duration:3900,target:.76,caption:'巡视自己的地盘'},
 {pose:'sit',duration:1200,caption:'发现了一个好位置'},
 {pose:'stretch',duration:2700,caption:'伸一个大大的懒腰'},
 {pose:'walk',duration:4800,target:.25,caption:'再四处走一走'},
 {pose:'loaf',duration:3300,caption:'把小手手收起来'},
 {pose:'sleep',duration:5200,caption:'安安心心睡一会儿'},
 {pose:'sit',duration:1800,caption:'醒啦，看看窗外'},
 {pose:'walk',duration:3700,target:.63,caption:'慢慢地散个步'},
 {pose:'stretch',duration:2400,caption:'伸伸腰，活动一下'},
 {pose:'sleep',duration:4300,caption:'继续做个好梦'}
];
function stopRoomLife(){roomBehavior.token++;clearTimeout(roomBehavior.timer);clearInterval(roomBehavior.walkFrameTimer);cancelAnimationFrame(roomBehavior.frame);roomBehavior.timer=null;roomBehavior.walkFrameTimer=null;}
function startRoomLife(){
 const actor=$$('roomCatActor'),img=$$('roomCat'),status=$$('roomMotion');if(!actor||!img||ui.tab!=='home')return;
 const token=roomBehavior.token;
 const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const room=$$('homeRoom');let previousX=Math.min(.75,Math.max(.25,roomBehavior.x));
 function run(){
  if(token!==roomBehavior.token||ui.tab!=='home'||document.hidden||!actor.isConnected)return;
  const move=roomSequence[roomBehavior.index++ % roomSequence.length];
  clearInterval(roomBehavior.walkFrameTimer);roomBehavior.walkFrameTimer=null;
  img.classList.remove('is-walking','is-stretching','is-breathing');
  status.textContent=move.caption;
  actor.style.transition='none'; actor.style.left=(previousX*100)+'%';
  if(move.pose==='walk'){
   const next=move.target??(previousX>.5?.25:.72);
   actor.style.setProperty('--face',next<previousX?1:-1);
   img.src=sprite('walk');img.classList.add('is-walking');
   let frame=0;roomBehavior.walkFrameTimer=setInterval(()=>{if(token!==roomBehavior.token||!img.isConnected){clearInterval(roomBehavior.walkFrameTimer);return;}img.src=sprite(['walk','walk-step1','walk','walk-step2'][frame++%4]);},205);
   roomBehavior.frame=requestAnimationFrame(()=>{roomBehavior.frame=requestAnimationFrame(()=>{if(token!==roomBehavior.token)return;actor.style.transition=`left ${move.duration}ms linear`;actor.style.left=(next*100)+'%';});});
   previousX=next;roomBehavior.x=next;
  }else{
   img.src=sprite(move.pose);img.classList.add(move.pose==='stretch'?'is-stretching':'is-breathing');
  }
  roomBehavior.timer=setTimeout(run,move.duration);
 }
 actor.style.transition='none';actor.style.left=(previousX*100)+'%';
 if(reduce){img.src=sprite('loaf');status.textContent='在这里安心地待着';return;}
 // Start the first visible action promptly, without interaction. Following phases continue indefinitely.
 run();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopRoomLife();}else if(ui.tab==='home'&&!roomBehavior.timer){startRoomLife();}});

// delegated actions
function actions(e){const el=e.target.closest('[data-action],[data-tab],[data-filter],[data-healthtab]');if(!el)return;if(el.dataset.tab){changeTab(el.dataset.tab);return}if(el.dataset.filter){ui.feedFilter=el.dataset.filter;render();return}if(el.dataset.healthtab){ui.healthTab=el.dataset.healthtab;render();return}let ac=el.dataset.action;switch(ac){case 'settings':settings();break;case 'cats':catsModal();break;case 'compose':compose();break;case 'close':close();break;case 'record-type':recordModal(el.dataset.type);break;case 'add-health':recordModal('weight');break;case 'choose-cat':state.selected=el.dataset.id;persist();close();render(true);break;case 'add-cat':pendingCatPhoto=null;catForm(false);break;case 'edit-cat':pendingCatPhoto=null;catForm(true);break;case 'like':{const p=state.posts.find(x=>x.id===el.dataset.id);if(p){p.liked=!p.liked;persist();render()}break}case 'delete-post':deletePost(el.dataset.id);break;case 'delete-health':deleteHealth(el.dataset.id);break;case 'ask':ask(el.dataset.question);break;case 'upload-post':$$('postFiles')?.click();break;case 'remove-draft':{const ta=document.querySelector('#composeForm textarea[name=text]');if(ta)ui.draftText=ta.value;ui.draftPhotos.splice(Number(el.dataset.index),1);$$('draftImages').innerHTML=draftPhotoHTML();break}case 'toggle-tag':{const ta=document.querySelector('#composeForm textarea[name=text]');if(ta)ui.draftText=ta.value;const t=el.dataset.tag;ui.draftTags=ui.draftTags.includes(t)?ui.draftTags.filter(x=>x!==t):[...ui.draftTags,t];$$('tagPicker').innerHTML=tagPickerHTML();break}case 'backup':exportBackup();break;}}
async function inputs(e){const el=e.target;if(el.id==='postFiles'){const files=[...(el.files||[])].slice(0,4-ui.draftPhotos.length);try{for(const f of files){const base=await compress(f,950,.68);ui.draftPhotos.push(base)}$$('draftImages').innerHTML=draftPhotoHTML();toast('照片已添加')}catch(err){toast(err.message)}el.value=''}if(el.id==='catPhotoFile'&&el.files[0]){try{pendingCatPhoto=await compress(el.files[0],400,.72);$$('catPhotoHint').textContent='照片选好啦，保存后生效 ♡'}catch(err){toast(err.message)}}if(el.id==='importFile'&&el.files[0]){try{const text=await el.files[0].text();const obj=JSON.parse(text);if(!obj.cats?.length||!Array.isArray(obj.posts)||!Array.isArray(obj.health))throw Error('备份文件格式不正确');if(!confirm('导入备份会覆盖当前设备上的全部记录。确定继续吗？'))return;state={version:1,cats:obj.cats,selected:obj.selected,posts:obj.posts,health:obj.health,chats:obj.chats||[]};persist();close();render(true);toast('备份导入成功')}catch(err){toast(err.message)}}}
function onSubmit(e){if(e.target.id==='chatForm'){e.preventDefault();const input=e.target.elements.question;const q=input.value.trim();if(q)ask(q);return}if(e.target.id==='composeForm'){e.preventDefault();const fd=new FormData(e.target);const text=String(fd.get('text')||'').trim();if(!text&&!ui.draftPhotos.length){toast('写一句话，或者选择一张猫咪照片吧');return}const post={id:uid('post'),catId:String(fd.get('catId')||state.selected),text,photos:[...ui.draftPhotos],tags:[...ui.draftTags],createdAt:new Date().toISOString(),demo:false,liked:false};state.posts.unshift(post);if(!persist()){state.posts.shift();return}ui.feedFilter='all';close();ui.tab='feed';render(true);toast('嗷呜成功！今天也有新的小故事 ✳');return}if(e.target.id==='recordForm'){e.preventDefault();const fd=new FormData(e.target),type=String(fd.get('type')),val=String(fd.get('value')||'');if(type==='weight'&&(!val||Number(val)<=0)){toast('请输入有效体重');return}state.health.push({id:uid('health'),catId:state.selected,type,date:String(fd.get('date')),title:String(fd.get('title')||''),value:val,note:String(fd.get('note')||''),nextDate:String(fd.get('nextDate')||'')});persist();close();ui.tab='health';ui.healthTab='overview';render();toast('健康记录保存好啦');return}if(e.target.id==='catForm'){e.preventDefault();const fd=new FormData(e.target),vals={name:String(fd.get('name')||'').trim(),breed:String(fd.get('breed')||'').trim(),birthday:String(fd.get('birthday')||''),arrival:String(fd.get('arrival')||''),sex:String(fd.get('sex')||''),neutered:String(fd.get('neutered')||''),note:String(fd.get('note')||'')};if(!vals.name){toast('给小猫取一个名字吧');return}if(ui.catFormMode==='edit'){Object.assign(cat(),vals);if(pendingCatPhoto)cat().photo=pendingCatPhoto}else{const id=uid('cat');state.cats.push({...vals,id,photo:pendingCatPhoto||SPRITES.sit,createdAt:new Date().toISOString()});state.selected=id}persist();pendingCatPhoto=null;close();render(true);toast('猫咪资料保存成功 ♡');return}}
$$('app').addEventListener('click',actions);$$('tabbar').addEventListener('click',actions);$$('overlay').addEventListener('click',actions);$$('overlay').addEventListener('change',inputs);document.addEventListener('submit',onSubmit);render(true);
if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
})();

</script>
</body>
